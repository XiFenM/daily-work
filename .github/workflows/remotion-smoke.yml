name: Remotion smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/video/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/remotion-smoke.yml"

jobs:
  still:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm video:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-smoke
          path: outputs/videos/smoke.png
          if-no-files-found: error
